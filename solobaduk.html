<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>혼자 바둑판 · 오목크라이스트</title><link rel="stylesheet" href="styles.css"></head><body class="game-page" data-mode="solo"><header class="game-header"><a class="back-link" href="index.html">← 처음으로</a><a class="game-brand" href="index.html">五 오목크라이스트</a><span class="eyebrow">SOLO BOARD</span></header><main class="game-layout"><section class="board-panel"><div class="board-top"><h1 class="game-title">혼자 바둑판</h1><span id="game-status" class="status-pill">흑돌 차례입니다.</span></div><div class="board-wrap"><div id="board" class="board" role="grid" aria-label="15줄 오목판"></div></div></section><aside class="side-panel"><div class="info-card"><h2>현재 대국</h2><div class="turn-indicator"><span id="turn-stone" class="mini-stone black"></span><span id="game-status-copy">돌을 놓아보세요</span></div><div class="score-row"><span class="score-black">흑 <b id="black-score">0</b></span><span class="score-white">백 <b id="white-score">0</b></span></div><div class="button-row"><button class="btn" id="reset-game">새로 두기</button><a class="btn secondary" href="index.html">나가기</a></div></div><div class="info-card"><h2>혼자 연습하기</h2><p class="helper">바둑판을 눌러 흑과 백을 번갈아 놓습니다. 가로, 세로, 대각선으로 다섯 돌을 먼저 이어보세요.</p></div></aside></main><script src="game.js"></script></body></html>
