<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI 연습 · 오목크라이스트</title><link rel="stylesheet" href="styles.css"></head><body class="game-page" data-mode="ai"><header class="game-header"><a class="back-link" href="index.html">← 처음으로</a><a class="game-brand" href="index.html">五 오목크라이스트</a><span class="eyebrow">AI PRACTICE</span></header><main class="game-layout"><section class="board-panel"><div class="board-top"><h1 class="game-title">제이오목과 연습</h1><span id="game-status" class="status-pill">흑돌 차례입니다.</span></div><div class="board-wrap"><div id="board" class="board" role="grid" aria-label="AI 오목판"></div></div></section><aside class="side-panel"><div class="info-card"><h2>AI 선택</h2><span class="tag">사용 가능</span><h3 style="margin:16px 0 4px">Jomok · 제이오목</h3><p class="helper">API 키를 붙여넣으면 제이오목이 실제 AI로 수를 계산합니다. 키가 없으면 기본 랜덤 모드로도 연습할 수 있습니다.</p><label class="api-label" for="ai-api-key">AI API 키</label><div class="api-input-row"><input id="ai-api-key" class="api-input" type="password" placeholder="API 키를 붙여넣으세요" autocomplete="off"><button class="btn secondary api-save" id="save-api-key">저장</button></div><p class="api-note" id="api-status">키는 이 브라우저에만 저장됩니다.</p><div class="button-row"><button class="btn" id="reset-game">새로 두기</button></div></div><div class="info-card"><h2>학습 상태</h2><div class="turn-indicator"><span class="mini-stone black"></span><span id="learning-label">학습 중</span><button class="btn secondary" id="learning-toggle" style="margin-left:auto;padding:7px 11px;font-size:12px">전환</button></div><p class="helper" style="margin-bottom:0">학습을 끄면 현재 게임은 진행되지만 플레이 기록은 저장하지 않습니다.</p></div></aside></main><script src="game.js"></script></body></html>
